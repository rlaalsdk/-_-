<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예상 랭킹전 — 1v1 토너먼트</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700&display=swap');

  :root{
    --void:#0A0A0B;
    --void-2:#141012;
    --panel:#1A1214;
    --panel-2:#221316;
    --line:#3D1A1E;
    --star:#E63946;
    --star-dim:#7A1620;
    --arc:#B0202E;
    --arc-dim:#4A1319;
    --text:#F3EDEE;
    --muted:#9C8688;
    --dmg:#FF5A45;
    --heal:#57D6A0;
    --font-display: 'Cinzel', serif;
    --font-deco: 'Cinzel Decorative', serif;
    --font-body: 'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',-apple-system,sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1px 1px at 10% 20%, rgba(230,57,70,.55) 0, transparent 60%),
      radial-gradient(1px 1px at 80% 10%, rgba(240,235,236,.35) 0, transparent 60%),
      radial-gradient(1.5px 1.5px at 60% 70%, rgba(230,57,70,.4) 0, transparent 60%),
      radial-gradient(1px 1px at 30% 85%, rgba(240,235,236,.3) 0, transparent 60%),
      radial-gradient(1px 1px at 92% 55%, rgba(230,57,70,.3) 0, transparent 60%),
      var(--void);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
  }
  #app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

  .brand{display:flex;align-items:baseline;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
  .brand .glyph{font-family:var(--font-deco);font-size:26px;color:var(--star);text-shadow:0 0 18px rgba(230,57,70,.55);}
  .brand h1{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.06em;margin:0;}
  .brand .sub{color:var(--muted);font-size:12.5px;letter-spacing:.03em;}

  nav.tabs{display:flex;gap:0;margin-bottom:26px;border-bottom:1px solid var(--line);position:relative;}
  nav.tabs button{
    background:none;border:none;color:var(--muted);font-family:var(--font-display);
    font-size:13.5px;letter-spacing:.08em;padding:12px 20px 14px;cursor:pointer;position:relative;
    transition:color .2s;
  }
  nav.tabs button::before{content:'✦';margin-right:8px;font-size:10px;opacity:.6;}
  nav.tabs button.active{color:var(--star);}
  nav.tabs button.active::after{
    content:'';position:absolute;left:14px;right:14px;bottom:-1px;height:2px;
    background:linear-gradient(90deg,transparent,var(--star),transparent);
  }
  nav.tabs button:hover{color:var(--text);}

  .panel{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:10px;padding:22px;}
  .panel + .panel{margin-top:18px;}
  h2.section{font-family:var(--font-display);font-size:15px;letter-spacing:.07em;color:var(--star);margin:0 0 16px;display:flex;align-items:center;gap:8px;}
  h2.section::before{content:'◆';font-size:9px;}
  .hint{color:var(--muted);font-size:12.5px;line-height:1.6;margin:-8px 0 16px;}

  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;letter-spacing:.02em;}
  input[type=text], select{
    width:100%;background:var(--void-2);border:1px solid var(--line);color:var(--text);
    padding:9px 11px;border-radius:6px;font-family:var(--font-body);font-size:13.5px;outline:none;
  }
  input[type=text]:focus, select:focus{border-color:var(--arc);}
  input[type=range]{width:100%;accent-color:var(--arc);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .field{margin-bottom:14px;}

  .stat-row{display:flex;align-items:center;gap:10px;}
  .stat-row .val{font-family:var(--font-mono);width:30px;text-align:right;color:var(--arc);font-size:13px;}
  .stat-row input[type=number]{
    width:56px;flex-shrink:0;background:var(--void-2);border:1px solid var(--line);color:var(--text);
    padding:6px 7px;border-radius:6px;font-family:var(--font-mono);font-size:13px;text-align:center;outline:none;
  }
  .stat-row input[type=number]:focus{border-color:var(--arc);}

  button.btn{
    font-family:var(--font-display);letter-spacing:.05em;font-size:12.5px;
    background:linear-gradient(180deg,var(--arc),#6b1420);color:#fff;border:none;
    padding:10px 18px;border-radius:6px;cursor:pointer;transition:filter .15s, transform .15s;
  }
  button.btn:hover{filter:brightness(1.12);}
  button.btn:active{transform:translateY(1px);}
  button.btn.gold{background:linear-gradient(180deg,var(--star),#8c1b26);}
  button.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted);}
  button.btn.ghost:hover{color:var(--text);border-color:var(--arc);}
  button.btn.danger{background:none;border:1px solid #5a2530;color:var(--dmg);}
  button.btn:disabled{opacity:.35;cursor:not-allowed;filter:none;}

  .skill-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .skill-row input{flex:1;}
  .skill-row .dice{max-width:90px;font-family:var(--font-mono);}

  .skill-block{background:var(--void-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;position:relative;}
  .skill-block .sb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .skill-block .sb-field{display:flex;flex-direction:column;gap:4px;}
  .skill-block .sb-field label{font-size:10.5px;color:var(--muted);margin:0;letter-spacing:.02em;}
  .skill-block .sb-field input, .skill-block .sb-field select{width:100%;}
  .skill-block .sb-wide{grid-column:span 2;}
  .skill-block .sb-full{grid-column:1 / -1;}
  .skill-block .sb-rmv{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--dmg);cursor:pointer;font-size:15px;}
  .rmv{background:none;border:none;color:var(--dmg);cursor:pointer;font-size:16px;padding:0 6px;}

  .roster-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:18px;}
  .char-card{background:var(--void-2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;position:relative;}
  .char-card .cc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .char-card .cc-name{font-family:var(--font-display);font-size:15px;}
  .rank-badge{
    font-family:var(--font-display);font-weight:700;font-size:12px;width:24px;height:24px;
    border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    border:1px solid currentColor;
  }
  .cc-stats{display:flex;flex-direction:column;gap:4px;margin:8px 0;}
  .cc-stat{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);}
  .cc-stat .lbl{width:34px;flex-shrink:0;}
  .cc-stat .bar{flex:1;height:5px;background:var(--panel);border-radius:3px;overflow:hidden;}
  .cc-stat .bar i{display:block;height:100%;background:var(--arc);}
  .cc-stat .num{width:24px;text-align:right;font-family:var(--font-mono);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip{font-size:10.5px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px 9px;color:var(--muted);}
  .chip.trait{border-color:var(--star-dim);color:var(--star);}
  .cc-del{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;}
  .cc-del:hover{color:var(--dmg);}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 0;border:1px dashed var(--line);border-radius:8px;}

  .bracket-scroll{overflow-x:auto;padding-bottom:10px;}
  .bracket-rounds{display:flex;gap:36px;min-width:max-content;padding:6px 2px;}
  .round-col{display:flex;flex-direction:column;justify-content:space-around;gap:14px;min-width:200px;}
  .round-title{font-family:var(--font-display);font-size:11px;letter-spacing:.08em;color:var(--muted);text-align:center;margin-bottom:6px;}
  .match{background:var(--void-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;cursor:pointer;transition:border-color .15s;}
  .match:hover{border-color:var(--arc);}
  .match.locked{cursor:not-allowed;opacity:.6;}
  .match .slot{display:flex;justify-content:space-between;align-items:center;padding:4px 2px;font-size:12.5px;}
  .match .slot.winner{color:var(--star);font-weight:600;}
  .match .slot.loser{color:var(--muted);text-decoration:line-through;text-decoration-color:#4a2c30;}
  .match .slot.bye{color:var(--muted);font-style:italic;}
  .match .vs{text-align:center;font-size:9px;color:var(--arc-dim);letter-spacing:.1em;}
  .champion-banner{text-align:center;padding:20px;margin-bottom:20px;}
  .champion-banner .cup{font-size:30px;}
  .champion-banner .name{font-family:var(--font-display);font-size:22px;color:var(--star);text-shadow:0 0 20px rgba(230,57,70,.55);margin-top:6px;}

  .battle-select{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
  .battle-select select{max-width:220px;}
  .vs-mark{font-family:var(--font-deco);color:var(--star);font-size:18px;}

  .arena{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:start;margin-bottom:20px;}
  .fighter{background:var(--void-2);border:1px solid var(--line);border-radius:8px;padding:14px;}
  .fighter.right{text-align:right;}
  .fighter .fname{font-family:var(--font-display);font-size:14px;margin-bottom:8px;}
  .hp-bar{height:12px;background:var(--panel);border-radius:6px;overflow:hidden;border:1px solid var(--line);}
  .hp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--star),var(--arc));transition:width .5s ease;}
  .hp-bar.low i{background:linear-gradient(90deg,#FFB020,var(--dmg));}
  .hp-text{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:4px;}
  .arena-center{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:24px;}

  .log-scroll{max-height:340px;overflow-y:auto;background:var(--void-2);border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:13px;line-height:1.9;}
  .log-scroll::-webkit-scrollbar{width:6px;}
  .log-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .log-line{opacity:0;animation:fadein .3s forwards;padding:3px 0;border-bottom:1px dashed rgba(74,44,48,.5);}
  .log-line:last-child{border-bottom:none;}
  @keyframes fadein{to{opacity:1;}}
  .log-line .tag{font-family:var(--font-mono);font-size:10px;color:var(--arc);margin-right:6px;}
  .log-line.dmg .tag{color:var(--dmg);}
  .log-line.crit{color:var(--star);}
  .log-line.trait{color:var(--star);font-weight:600;}
  .log-line.result{color:var(--star);font-family:var(--font-display);font-size:14px;margin-top:8px;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--star-dim);color:var(--star);padding:10px 20px;border-radius:30px;font-size:13px;z-index:99;box-shadow:0 4px 20px rgba(0,0,0,.4);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .count-badge{font-family:var(--font-mono);font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div id="app"></div>

<script>
const STORE_SHARED = true;
const state = { characters: [], bracket: null, tab: 'roster', battleSel: [null,null], activeMatchRef: null, skillDraft: [] };
const RANK_COLOR = { S:'#FF3B30', A:'#E63946', B:'#C81E3A', C:'#A31621', D:'#7A1620', F:'#8a7476' };
const RANK_ORDER = ['S','A','B','C','D','F'];
const RANK_STAT_CAP = { S:400, A:350, B:300, C:270, D:250, F:220 };
const GRADE_BONUS = { S:15, A:10, B:5, C:0, D:-5, F:-10 };
const STAT_LABEL = { sp:'이능력', agi:'민첩', hp:'체력', str:'근력', def:'방어' };

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function q(sel,root=document){ return root.querySelector(sel); }
function qa(sel,root=document){ return [...root.querySelectorAll(sel)]; }

async function storageGet(key){
  try{ const r = await window.storage.get(key, STORE_SHARED); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function storageSet(key, val){
  try{ await window.storage.set(key, JSON.stringify(val), STORE_SHARED); }
  catch(e){ console.error('storage set failed', e); }
}

async function loadAll(){
  const chars = await storageGet('characters');
  const bracket = await storageGet('bracket');
  state.characters = chars || [];
  state.bracket = bracket || null;
}
async function saveCharacters(){ await storageSet('characters', state.characters); }
async function saveBracket(){ await storageSet('bracket', state.bracket); }

function showToast(msg){
  const existing = q('.toast'); if(existing) existing.remove();
  const t = el(`<div class="toast">${msg}</div>`);
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}

// ---------- RENDER SHELL ----------
function render(){
  const app = q('#app');
  app.innerHTML = `
    <div class="brand">
      <span class="glyph">✧</span>
      <h1>예상 랭킹전</h1>
      <span class="sub">— 1v1 토너먼트 전투 시스템</span>
    </div>
    <nav class="tabs">
      <button data-tab="roster" class="${state.tab==='roster'?'active':''}">헌터 명부</button>
      <button data-tab="bracket" class="${state.tab==='bracket'?'active':''}">대진표</button>
      <button data-tab="battle" class="${state.tab==='battle'?'active':''}">전투 시뮬레이터</button>
    </nav>
    <div id="tab-body"></div>
  `;
  qa('nav.tabs button').forEach(b=>b.addEventListener('click', ()=>{ state.tab=b.dataset.tab; render(); }));
  const body = q('#tab-body');
  if(state.tab==='roster') body.appendChild(renderRosterTab());
  if(state.tab==='bracket') body.appendChild(renderBracketTab());
  if(state.tab==='battle') body.appendChild(renderBattleTab());
}

// ---------- ROSTER TAB ----------
function renderRosterTab(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(renderCharForm());

  const listPanel = el(`<div class="panel"></div>`);
  const toolbar = el(`<div class="toolbar">
      <h2 class="section" style="margin:0">등록된 헌터</h2>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="count-badge">${state.characters.length}명 등록됨 · 대진 권장 20~40명</span>
        ${state.characters.length>0 ? `<button class="btn danger" id="clear-roster">명부 전체 초기화</button>` : ''}
      </div>
    </div>`);
  listPanel.appendChild(toolbar);
  const clearRosterBtn = q('#clear-roster', toolbar);
  if(clearRosterBtn){
    clearRosterBtn.addEventListener('click', async ()=>{
      if(!confirm('등록된 헌터를 모두 삭제할까요? 대진표도 함께 초기화됩니다.')) return;
      state.characters = [];
      state.bracket = null;
      await saveCharacters();
      await saveBracket();
      showToast('헌터 명부를 초기화했습니다');
      render();
    });
  }

  if(state.characters.length===0){
    listPanel.appendChild(el(`<div class="empty">아직 등록된 헌터가 없습니다. 위 폼에서 첫 헌터를 등록해보세요.</div>`));
  } else {
    const grid = el(`<div class="roster-list"></div>`);
    state.characters.slice().sort((a,b)=>RANK_ORDER.indexOf(a.rank)-RANK_ORDER.indexOf(b.rank)).forEach(c=>{
      grid.appendChild(renderCharCard(c));
    });
    listPanel.appendChild(grid);
  }
  wrap.appendChild(listPanel);
  return wrap;
}

function renderCharCard(c){
  const rc = RANK_COLOR[c.rank];
  const card = el(`<div class="char-card">
    <button class="cc-del" title="삭제">✕</button>
    <div class="cc-head">
      <span class="cc-name">${escapeHtml(c.name)}</span>
      <span class="rank-badge" style="color:${rc}">${c.rank}</span>
    </div>
    <div class="cc-stats">
      ${Object.entries(STAT_LABEL).map(([k,label])=>`
        <div class="cc-stat">
          <span class="lbl">${label}</span>
          <span class="bar"><i style="width:${c.stats[k]}%"></i></span>
          <span class="num">${c.stats[k]}</span>
        </div>`).join('')}
      <div style="text-align:right;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);margin-top:2px">
        합산 ${Object.values(c.stats).reduce((s,v)=>s+v,0)} / ${RANK_STAT_CAP[c.rank]}
      </div>
    </div>
    <div class="chips">
      ${(c.skills||[]).map(s=>{
        const title = [s.desc?`설명: ${s.desc}`:'', s.effect?`부가효과: ${s.effect}`:''].filter(Boolean).join(' / ');
        return `<span class="chip" title="${escapeHtml(title)}">⚡ ${escapeHtml(s.name)} [${s.grade||'-'}급/${STAT_LABEL[s.stat]||''}] · 판정 ${escapeHtml(s.formula||'')}${s.bonus?`+${s.bonus}`:''} · 쿨 ${s.cooldown ?? 2}턴</span>`;
      }).join('')}
      ${(c.passives||[]).map(p=>`<span class="chip" title="${escapeHtml(p.desc||'')}">◇ ${escapeHtml(p.name)}</span>`).join('')}
      ${c.rank==='S' && c.trait && c.trait.name ? `<span class="chip trait">★ 특성: ${escapeHtml(c.trait.name)}</span>` : ''}
    </div>
  </div>`);
  card.querySelector('.cc-del').addEventListener('click', async ()=>{
    if(!confirm(`${c.name} 캐릭터를 삭제할까요?`)) return;
    state.characters = state.characters.filter(x=>x.id!==c.id);
    await saveCharacters();
    render();
  });
  return card;
}

function renderCharForm(){
  state.skillDraft = state.skillDraft && state.skillDraft.length ? state.skillDraft : [{stat:'sp', name:'', grade:'C', desc:'', effect:'', cooldown:2, formula:'1d6', bonus:0}];
  state.passiveDraft = state.passiveDraft && state.passiveDraft.length ? state.passiveDraft : [{name:'',desc:''}];
  const panel = el(`<div class="panel">
    <h2 class="section">새 헌터 등록</h2>
    <div class="hint">스탯은 0~100 범위, 등급은 S/A/B/C/D/F. 등급별 스탯 합산 상한: S 400 · A 350 · B 300 · C 270 · D 250 · F 220. 액티브 스킬·패시브 스킬 각각 최대 5개까지 등록 가능합니다. 판정 칸의 주사위 표기는 "2d6" 형식으로 입력하세요.</div>
    <div class="grid2">
      <div class="field"><label>이름</label><input type="text" id="f-name" placeholder="헌터 이름"></div>
      <div class="field"><label>등급</label>
        <select id="f-rank">${RANK_ORDER.map(r=>`<option value="${r}">${r}급 (스탯 상한 ${RANK_STAT_CAP[r]})</option>`).join('')}</select>
      </div>
    </div>
    <div class="field"><label>스탯 (슬라이더 또는 숫자 직접 입력, 0~100)</label>
      <div class="grid5" id="f-stats">
        ${Object.entries(STAT_LABEL).map(([k,label])=>`
          <div>
            <label style="margin-bottom:2px">${label}</label>
            <div class="stat-row">
              <input type="range" min="0" max="100" value="50" data-stat="${k}">
              <input type="number" min="0" max="100" value="50" data-statnum="${k}">
            </div>
          </div>`).join('')}
      </div>
      <div id="stat-total" style="text-align:right;font-family:var(--font-mono);font-size:12px;margin-top:8px;color:var(--muted)"></div>
    </div>
    <div class="field">
      <label>액티브 스킬 (최대 5개)</label>
      <div id="f-skills"></div>
      <button class="btn ghost" id="add-skill" type="button">+ 스킬 추가</button>
    </div>
    <div class="field">
      <label>패시브 스킬 (최대 5개, 선택)</label>
      <div id="f-passives"></div>
      <button class="btn ghost" id="add-passive" type="button">+ 패시브 추가</button>
    </div>
    <div class="grid2" id="f-trait-wrap" style="display:none">
      <div class="field"><label>특성 이름 (S급 전용)</label><input type="text" id="f-trait-name" placeholder="예: 절멸하는 폭군의 걸음"></div>

// ---------- BRACKET TAB ----------
function nextPow2(n){ let p=1; while(p<n) p*=2; return p; }

async function generateBracket(){
  const pool = state.characters.slice();
  if(pool.length<2){ showToast('최소 2명 이상 등록해야 대진표를 만들 수 있습니다'); return; }
  // shuffle
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const size = nextPow2(pool.length);
  const byeCount = size - pool.length;
  const slots = pool.map(c=>c.id);
  for(let i=0;i<byeCount;i++) slots.push(null); // null = bye
  // shuffle again so byes distribute randomly
  for(let i=slots.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [slots[i],slots[j]]=[slots[j],slots[i]]; }

  const round0 = [];
  for(let i=0;i<slots.length;i+=2){
    const p1 = slots[i], p2 = slots[i+1];
    let winner = null;
    if(p1===null && p2!==null) winner = p2;
    if(p2===null && p1!==null) winner = p1;
    round0.push({ id: uid(), p1, p2, winner });
  }
  const rounds = [round0];
  let count = round0.length;
  while(count>1){
    count = count/2;
    rounds.push(Array.from({length:count},()=>({ id: uid(), p1:'TBD', p2:'TBD', winner:null })));
  }
  propagate(rounds);
  state.bracket = { rounds, createdAt: Date.now() };
  await saveBracket();
  render();
}

function propagate(rounds){
  for(let r=0;r<rounds.length-1;r++){
    rounds[r].forEach((m,i)=>{
      if(m.winner){
        const nextMatch = rounds[r+1][Math.floor(i/2)];
        if(i%2===0) nextMatch.p1 = m.winner; else nextMatch.p2 = m.winner;
      }
    });
  }
}

function charById(id){ return state.characters.find(c=>c.id===id); }

function renderBracketTab(){
  const wrap = el(`<div></div>`);
  const top = el(`<div class="panel">
    <div class="toolbar">
      <h2 class="section" style="margin:0">토너먼트 대진표</h2>

        <button class="btn gold" id="gen-bracket">대진표 생성 (현재 명부 기준)</button>
        ${state.bracket ? `<button class="btn danger" id="clear-bracket">대진표 초기화</button>` : ''}
      </div>
    </div>
    <div class="hint">등록된 헌터 수가 2의 거듭제곱이 아니면 부전승(BYE)이 무작위로 배정되어 1라운드에 자동 진출합니다.</div>
    <div id="bracket-body"></div>
  </div>`);
  wrap.appendChild(top);

  q('#gen-bracket', top).addEventListener('click', async ()=>{
    if(state.bracket && !confirm('기존 대진표를 덮어쓰고 새로 생성할까요?')) return;
    await generateBracket();
  });
  const clearBtn = q('#clear-bracket', top);
  if(clearBtn) clearBtn.addEventListener('click', async ()=>{
    if(!confirm('대진표를 초기화할까요?')) return;
    state.bracket = null; await saveBracket(); render();
  });

  const body = q('#bracket-body', top);
  if(!state.bracket){
    body.appendChild(el(`<div class="empty">아직 생성된 대진표가 없습니다.</div>`));
    return wrap;
  }

  const lastRound = state.bracket.rounds[state.bracket.rounds.length-1];
  if(lastRound.length===1 && lastRound[0].winner){
    const champ = charById(lastRound[0].winner);
    if(champ){
      body.appendChild(el(`<div class="champion-banner">
        <div class="cup">🏆</div>
        <div class="name">${escapeHtml(champ.name)} · ${champ.rank}급</div>
      </div>`));
    }
  }

  const scroll = el(`<div class="bracket-scroll"><div class="bracket-rounds"></div></div>`);
  const rr = q('.bracket-rounds', scroll);
  state.bracket.rounds.forEach((round, ri)=>{
    const title = ri===state.bracket.rounds.length-1 ? '결승' : (ri===state.bracket.rounds.length-2 ? '준결승' : `${ri+1}라운드`);
    const col = el(`<div class="round-col"><div class="round-title">${title}</div></div>`);
    round.forEach(m=>{
      col.appendChild(renderMatchCard(m));
    });
    rr.appendChild(col);

  return wrap;

function renderMatchCard(m){
  const p1 = m.p1 && m.p1!=='TBD' ? charById(m.p1) : null;
  const p2 = m.p2 && m.p2!=='TBD' ? charById(m.p2) : null;
  const p1IsBye = m.p1===null;
  const p2IsBye = m.p2===null;
  const p1TBD = m.p1==='TBD';
  const p2TBD = m.p2==='TBD';

  function slotClass(id){
    if(!m.winner) return '';
    return m.winner===id ? 'winner' : 'loser';
  }
  const p1Label = p1IsBye ? 'BYE' : (p1TBD ? '— 대기 중 —' : escapeHtml(p1.name));
  const p2Label = p2IsBye ? 'BYE' : (p2TBD ? '— 대기 중 —' : escapeHtml(p2.name));
  const p1Cls = p1IsBye ? 'bye' : slotClass(m.p1);
  const p2Cls = p2IsBye ? 'bye' : slotClass(m.p2);

  const playable = p1 && p2 && !m.winner;
  const card = el(`<div class="match ${playable?'':'locked'}">
    <div class="slot ${p1Cls}"><span>${p1Label}</span>${p1&&!p1IsBye? `<span class="rank-badge" style="width:16px;height:16px;font-size:9px;color:${RANK_COLOR[p1.rank]}">${p1.rank}</span>`:''}</div>
    <div class="vs">VS</div>
    <div class="slot ${p2Cls}"><span>${p2Label}</span>${p2&&!p2IsBye? `<span class="rank-badge" style="width:16px;height:16px;font-size:9px;color:${RANK_COLOR[p2.rank]}">${p2.rank}</span>`:''}</div>
  </div>`);
  if(playable){
    card.addEventListener('click', ()=>{
      state.battleSel = [m.p1, m.p2];
      state.activeMatchRef = m.id;
      state.tab = 'battle';
      render();
    });
  }
  return card;
}

// ---------- BATTLE ENGINE ----------
function rollD100(){ return 1+Math.floor(Math.random()*100); }
function rollDice(formula){
  const match = /(\d+)\s*d\s*(\d+)/i.exec(formula||'');
  if(!match) return 1;
  const n=+match[1], d=+match[2];
  let sum=0; for(let i=0;i<n;i++) sum += 1+Math.floor(Math.random()*d);
  return sum;
}
function degree(roll, stat){
  if(roll>=96) return 'fumble';
  const crit = Math.max(1, Math.floor(stat/20));
  const hard = Math.floor(stat/2);
  if(roll<=crit) return 'critical';
  if(roll<=hard) return 'hard';
  if(roll<=stat) return 'success';
  return 'fail';
}
const DEG_RANK = { fumble:-1, fail:0, success:1, hard:2, critical:3 };
const DEG_LABEL = { fumble:'펌블', fail:'실패', success:'성공', hard:'하드성공', critical:'크리티컬' };

function runBattle(a, b){
  const maxHp = { [a.id]: a.stats.hp*3, [b.id]: b.stats.hp*3 };
  const hp = { [a.id]: maxHp[a.id], [b.id]: maxHp[b.id] };
  const cooldown = { [a.id]:{}, [b.id]:{} };
  (a.skills||[]).forEach(s=>cooldown[a.id][s.name]=0);
  (b.skills||[]).forEach(s=>cooldown[b.id][s.name]=0);
  const traitUsed = new Set();
  const log = [];

  let order = [a,b];
  if(b.stats.agi>a.stats.agi) order=[b,a];
  else if(a.stats.agi===b.stats.agi && Math.random()<0.5) order=[b,a];

  log.push({type:'info', text:`선공: ${order[0].name} (민첩 ${order[0].stats.agi})`, hpA:hp[a.id], hpB:hp[b.id]});

  let turn=0; const MAX_TURNS=150;
  while(hp[a.id]>0 && hp[b.id]>0 && turn<MAX_TURNS){
    for(const attacker of order){
      if(hp[a.id]<=0 || hp[b.id]<=0) break;
      const defender = attacker.id===a.id ? b : a;
      doTurn(attacker, defender);
      turn++;
    }
  }
  let winner;
  if(hp[a.id]<=0 && hp[b.id]<=0) winner = Math.random()<0.5? a.id : b.id;
  else if(hp[a.id]<=0) winner = b.id;
  else if(hp[b.id]<=0) winner = a.id;
  else winner = hp[a.id]>=hp[b.id] ? a.id : b.id; // timeout tiebreak

  const winChar = winner===a.id ? a : b;
  log.push({type:'result', text:`🏆 ${winChar.name}의 승리!`, hpA:Math.max(hp[a.id],0), hpB:Math.max(hp[b.id],0)});

  return { log, winner, maxHpA: maxHp[a.id], maxHpB: maxHp[b.id] };

  function doTurn(attacker, defender){
    Object.keys(cooldown[attacker.id]).forEach(k=>{ if(cooldown[attacker.id][k]>0) cooldown[attacker.id][k]--; });
    const availSkills = (attacker.skills||[]).filter(s=>cooldown[attacker.id][s.name]===0);
    let useSkill = availSkills.length>0 && Math.random()<0.6;
    let statKey, diceFormula, actionName, gradeBonus=0, flatBonus=0, effectText='';
    if(useSkill){
      const s = availSkills[Math.floor(Math.random()*availSkills.length)];
      statKey = s.stat || 'sp';
      diceFormula = s.formula || '1d6';
      actionName = s.name;
      gradeBonus = GRADE_BONUS[s.grade] ?? 0;
      flatBonus = s.bonus || 0;
      effectText = s.effect || '';
      cooldown[attacker.id][s.name] = s.cooldown ?? 2;
    } else {
      statKey='str'; diceFormula='1d6'; actionName='기본공격';
    }

    let traitBonus=0, traitDice='';
    if(attacker.rank==='S' && attacker.trait && attacker.trait.name && !traitUsed.has(attacker.id) && hp[attacker.id] <= maxHp[attacker.id]*0.3){
      traitBonus=20; traitDice='1d6'; traitUsed.add(attacker.id);
      log.push({type:'trait', text:`✦ ${attacker.name}의 특성 【${attacker.trait.name}】 발동! (판정 +20)`, hpA:Math.max(hp[a.id],0), hpB:Math.max(hp[b.id],0)});
    }

    const atkRoll = rollD100();
    const atkStat = Math.min(100, attacker.stats[statKey] + traitBonus + gradeBonus);
    const atkDeg = degree(atkRoll, atkStat);

    if(atkDeg==='fail' || atkDeg==='fumble'){
      log.push({type:'miss', text:`${attacker.name}의 [${actionName}] — d100:${atkRoll} vs ${atkStat} → ${DEG_LABEL[atkDeg]}. 빗나감.`, hpA:Math.max(hp[a.id],0), hpB:Math.max(hp[b.id],0)});
      return;
    }

    const defRoll = rollD100();
    const defDeg = degree(defRoll, defender.stats.def);

    if(DEG_RANK[defDeg] >= DEG_RANK[atkDeg]){
      log.push({type:'evade', text:`${attacker.name}의 [${actionName}] (${DEG_LABEL[atkDeg]}) → ${defender.name}가 방어(${DEG_LABEL[defDeg]})로 완전히 막아냄.`, hpA:Math.max(hp[a.id],0), hpB:Math.max(hp[b.id],0)});
      return;
    }

    let dmg = rollDice(diceFormula) + flatBonus;
    if(statKey==='str') dmg += Math.floor(attacker.stats.str/10);
    else if(useSkill) dmg += Math.floor(attacker.stats[statKey]/15);
    if(traitDice) dmg += rollDice(traitDice);
    if(atkDeg==='critical') dmg = Math.floor(dmg*2);
    else if(atkDeg==='hard') dmg = Math.floor(dmg*1.5);
    const mitig = DEG_RANK[defDeg]>=1 ? Math.floor(defender.stats.def/10) : Math.floor(defender.stats.def/20);
    dmg = Math.max(1, dmg-mitig);
    hp[defender.id] = Math.max(0, hp[defender.id]-dmg);

    const cls = atkDeg==='critical' ? 'crit' : 'dmg';
    const effectNote = effectText ? ` (부가효과: ${effectText})` : '';
    log.push({type:cls, text:`${attacker.name}의 [${actionName}] (${DEG_LABEL[atkDeg]}, d100:${atkRoll}) → ${defender.name}에게 ${dmg} 데미지!${effectNote} (방어 ${DEG_LABEL[defDeg]}, 경감 ${mitig})`, hpA:Math.max(hp[a.id],0), hpB:Math.max(hp[b.id],0)});
  }
}

function renderBattleTab(){
  const wrap = el(`<div class="panel"></div>`);
  wrap.appendChild(el(`<h2 class="section">전투 시뮬레이터</h2>`));

  if(state.characters.length<2){
    wrap.appendChild(el(`<div class="empty">전투를 시뮬레이션하려면 헌터가 2명 이상 필요합니다.</div>`));
    return wrap;
  }

  const sel1 = state.battleSel[0] || state.characters[0].id;
  const sel2 = state.battleSel[1] || (state.characters[1] ? state.characters[1].id : state.characters[0].id);

  const selectRow = el(`<div class="battle-select">
    <select id="sel-a">${state.characters.map(c=>`<option value="${c.id}" ${c.id===sel1?'selected':''}>${escapeHtml(c.name)} (${c.rank})</option>`).join('')}</select>
    <span class="vs-mark">VS</span>
    <select id="sel-b">${state.characters.map(c=>`<option value="${c.id}" ${c.id===sel2?'selected':''}>${escapeHtml(c.name)} (${c.rank})</option>`).join('')}</select>
    <button class="btn gold" id="run-battle">전투 시작</button>
  </div>`);
  wrap.appendChild(selectRow);

  q('#sel-a', selectRow).addEventListener('change', e=>{ state.battleSel[0]=e.target.value; });
  q('#sel-b', selectRow).addEventListener('change', e=>{ state.battleSel[1]=e.target.value; });

  const arena = el(`<div class="arena">
    <div class="fighter" id="fighter-a"></div>
    <div class="arena-center"><span class="vs-mark">⚔</span></div>
    <div class="fighter right" id="fighter-b"></div>
  </div>`);
  wrap.appendChild(arena);

  const logBox = el(`<div class="log-scroll" id="log-box"><div class="hint" style="margin:0">전투 시작 버튼을 누르면 판정 로그가 표시됩니다.</div></div>`);
  wrap.appendChild(logBox);

  function paintFighters(a,b, hpA, hpB, maxA, maxB){
    const pctA = Math.max(0,Math.round(hpA/maxA*100));
    const pctB = Math.max(0,Math.round(hpB/maxB*100));
    q('#fighter-a', arena).innerHTML = `<div class="fname">${escapeHtml(a.name)} <span style="color:${RANK_COLOR[a.rank]};font-size:11px">${a.rank}급</span></div>
      <div class="hp-bar ${pctA<30?'low':''}"><i style="width:${pctA}%"></i></div>
      <div class="hp-text">HP ${hpA} / ${maxA}</div>`;
    q('#fighter-b', arena).innerHTML = `<div class="fname">${escapeHtml(b.name)} <span style="color:${RANK_COLOR[b.rank]};font-size:11px">${b.rank}급</span></div>
      <div class="hp-bar ${pctB<30?'low':''}"><i style="width:${pctB}%"></i></div>
      <div class="hp-text">HP ${hpB} / ${maxB}</div>`;
  }

  const cA = charById(sel1), cB = charById(sel2);
  if(cA && cB) paintFighters(cA, cB, cA.stats.hp*3, cB.stats.hp*3, cA.stats.hp*3, cB.stats.hp*3);

  q('#run-battle', arena.parentElement || wrap).addEventListener('click', async ()=>{
    const aId = q('#sel-a', selectRow).value, bId = q('#sel-b', selectRow).value;
    if(aId===bId){ showToast('서로 다른 헌터를 선택해주세요'); return; }
    const a = charById(aId), b = charById(bId);
    const result = runBattle(a,b);
    await playLog(result, a, b, logBox, arena, aId===state.battleSel[0] && bId===state.battleSel[1]);
  });

  return wrap;

  async function playLog(result, a, b, logBox, arena){
    const btn = q('#run-battle');
    if(btn) btn.disabled = true;
    logBox.innerHTML = '';
    for(const entry of result.log){
      const line = el(`<div class="log-line ${entry.type}"><span class="tag">${entry.type.toUpperCase()}</span>${escapeHtml(entry.text)}</div>`);
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
      paintFighters(a,b, entry.hpA, entry.hpB, result.maxHpA, result.maxHpB);
      await new Promise(r=>setTimeout(r, 260));
    }
    if(btn) btn.disabled = false;

    // if this pairing matches an unresolved bracket match, offer to record
    if(state.bracket && state.activeMatchRef){
      const allMatches = state.bracket.rounds.flat();
      const m = allMatches.find(x=>x.id===state.activeMatchRef && !x.winner && ((x.p1===a.id&&x.p2===b.id)||(x.p1===b.id&&x.p2===a.id)));
      if(m){
        const applyBtn = el(`<button class="btn gold" style="margin-top:10px">결과를 대진표에 반영</button>`);
        logBox.parentElement.appendChild(applyBtn);
        applyBtn.addEventListener('click', async ()=>{
          m.winner = result.winner;
          propagate(state.bracket.rounds);
          await saveBracket();
          state.activeMatchRef = null;
          showToast('대진표에 결과가 반영되었습니다');
          state.tab='bracket';
          render();
        });
      }
    }
  }
}

function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

// ---------- INIT ----------
(async function init(){
  q('#app').innerHTML = `<div class="hint" style="padding:40px 0;text-align:center">불러오는 중…</div>`;
  await loadAll();
  render();
})();
</script>
